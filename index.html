  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { max-width: 100%; overflow-x: hidden; }
    body {
      margin: 0; padding: 0;
      max-width: 100%; overflow-x: hidden;
      font-family: 'DM Sans', -apple-system, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    #root { max-width: 100%; overflow-x: hidden; }

    /* ── Animations ────────────────────────────────────────────── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade { animation: fadeInUp 0.18s ease; }

    /* ── Mobile-first layout utilities ────────────────────────── */
    .m-col       { display: flex; flex-direction: column; }
    .m-full      { width: 100% !important; max-width: 100% !important; }
    .m-pad       { padding: 12px 16px !important; }

    /* ── KPI grid ──────────────────────────────────────────────── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    @media (max-width: 600px) {
      .kpi-grid {
        grid-template-columns: 1fr 1fr !important;
        gap: 10px !important;
      }
    }
    @media (max-width: 360px) {
      .kpi-grid { grid-template-columns: 1fr !important; }
    }

    /* ── Page header ───────────────────────────────────────────── */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    @media (max-width: 767px) {
      .page-header {
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 10px !important;
      }
      .page-header input[type="text"],
      .page-header input[type="search"] {
        width: 100% !important;
        max-width: 100% !important;
      }
      .page-header button {
        width: 100% !important;
        justify-content: center !important;
      }
    }

    /* ── Dashboard panels ──────────────────────────────────────── */
    .dash-panel-2 {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      align-items: start;
    }
    .dash-panel-rev {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .dash-panel-2, .dash-panel-rev {
        grid-template-columns: 1fr !important;
        gap: 14px !important;
      }
    }

    /* ── Form grid ─────────────────────────────────────────────── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr !important; gap: 10px !important; }
    }

    /* ── Table / Card toggle ───────────────────────────────────── */
    @media (max-width: 767px) {
      .rsp-table { display: none !important; }
      .rsp-cards { display: block !important; }
    }
    @media (min-width: 768px) {
      .rsp-table { display: table !important; }
      .rsp-cards { display: none !important; }
    }

    /* ── Scroll hint ───────────────────────────────────────────── */
    .scroll-x-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    .scroll-x-wrap::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0; width: 28px;
      background: linear-gradient(to left, rgba(255,255,255,.9), transparent);
      pointer-events: none;
    }

    /* ── Tabs scrollable ───────────────────────────────────────── */
    .tabs-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }

    /* ── Modal ─────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(13,27,62,.55);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-inner {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .modal-inner-wide { max-width: 720px; }
    @media (max-width: 600px) {
      .modal-overlay {
        align-items: flex-end !important;
        padding: 0 !important;
      }
      .modal-inner {
        max-width: 100% !important;
        max-height: 88vh !important;
        border-radius: 16px 16px 0 0 !important;
        padding-bottom: env(safe-area-inset-bottom, 16px);
      }
    }

    /* ── Settings layout ───────────────────────────────────────── */
    .settings-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 767px) {
      .settings-layout { grid-template-columns: 1fr !important; gap: 0 !important; }
    }

    /* ── Side panel stacking ───────────────────────────────────── */
    .side-panel-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .side-panel-layout { grid-template-columns: 1fr !important; }
    }

    /* ── Reports layout ────────────────────────────────────────── */
    .reports-layout {
      display: grid;
      grid-template-columns: 1fr 1fr 280px;
      gap: 16px;
    }
    @media (max-width: 1100px) {
      .reports-layout { grid-template-columns: 1fr 1fr !important; }
    }
    @media (max-width: 700px) {
      .reports-layout { grid-template-columns: 1fr !important; }
    }

    /* ── Detail 3-col → 1 on mobile ────────────────────────────── */
    .detail-layout-3 {
      display: grid;
      grid-template-columns: 280px 1fr 260px;
      gap: 0;
    }
    @media (max-width: 900px) {
      .detail-layout-3 { grid-template-columns: 1fr !important; }
    }

    /* ── Touch targets ─────────────────────────────────────────── */
    @media (max-width: 767px) {
      button, a, [role="button"] { min-height: 44px; }
    }

    /* ── Safe area ─────────────────────────────────────────────── */
    .safe-bottom {
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    }
    @supports (padding: max(0px)) {
      .main-content-mobile {
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }
    }

    /* ── Prevent overflow on all cards ────────────────────────── */
    @media (max-width: 767px) {
      [class*="card"], [class*="Card"] {
        max-width: 100%;
        overflow: hidden;
      }
      input, select, textarea {
        max-width: 100%;
      }
    }

    /* ── Sidebar overlay on mobile ─────────────────────────────── */
    @media (max-width: 767px) {
      .sidebar-overlay {
        position: fixed; inset: 0; z-index: 200;
        background: rgba(0,0,0,0.4);
      }
    }

    /* ── Messages mobile ───────────────────────────────────────── */
    .messages-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: calc(100vh - 80px);
      overflow: hidden;
    }
    @media (max-width: 767px) {
      .messages-layout { grid-template-columns: 1fr !important; }
    }
  </style>

  <style>

  </style>

  <script>

      var boot = document.getElementById('boot-screen');
      if (boot) {
        boot.innerHTML = '<div style="padding:40px;color:#fff;font-family:monospace;font-size:13px;max-width:800px;margin:0 auto">' +

          '<div style="color:rgba(255,255,255,0.5);font-size:11px">' + src + ' L' + line + ':' + col + '</div>' +
          '<div style="margin-top:24px;color:rgba(255,255,255,0.4);font-size:11px">Konsolu açın (F12) daha fazla bilgi için</div>' +
          '</div>';
      }
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      window.onerror(e.reason && e.reason.message || String(e.reason), 'promise', 0, 0, e.reason);
    });
  </script>

  <!-- Hide boot screen once React renders -->
  <script>
    (function() {
      var maxWait = 12000; // 12s timeout
      var started = Date.now();
      function checkReady() {
        var root = document.getElementById('root');
        var boot = document.getElementById('boot-screen');
        if (root && root.children.length > 0) {
          boot && boot.classList.add('hidden');
          setTimeout(function(){ boot && (boot.style.display = 'none'); }, 500);
        } else if (Date.now() - started < maxWait) {
          setTimeout(checkReady, 100);
        } else {
          // Timeout — hide anyway
          boot && boot.classList.add('hidden');
        }
      }
      setTimeout(checkReady, 200);
    })();
  </script>
